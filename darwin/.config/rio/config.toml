# See the full configuration reference: https://rioterm.com/docs/config
# Ported from darwin/.config/ghostty/config — see notes at the bottom for
# things Ghostty supports that Rio has no equivalent for.

copy-on-select = false
hide-mouse-cursor-when-typing = true
line-height = 1.2 # ghostty: adjust-cell-height = 20%
option-as-alt = "both" # ghostty: macos-option-as-alt = true
theme = "rosepine"

[fonts]
size = 14

[fonts.regular]
family = "FiraCode Nerd Font Mono"

[fonts.bold]
family = "FiraCode Nerd Font Mono"

[fonts.italic]
family = "FiraCode Nerd Font Mono"

[fonts.bold-italic]
family = "FiraCode Nerd Font Mono"

[cursor]
shape = "block"
blinking = false

[scroll]
multiplier = 2.0
divider = 1.0

[window]
opacity = 0.80
blur = true # ghostty had a blur radius (24); Rio only supports on/off
decorations = "Enabled"
macos-use-unified-titlebar = true # closest match to ghostty's macos-titlebar-style = "tabs"
macos-use-shadow = true

# Rio has no leader-key/sequence support, so the ghostty "cmd+s > x" chords
# are flattened to direct super+key chords below.
[bindings]
keys = [
  { key = "w", with = "super", action = "CloseSplitOrTab" },
  { key = "n", with = "super", action = "CreateWindow" },
  { key = "t", with = "super", action = "CreateTab" },
  { key = "l", with = "super | shift", action = "SelectNextTab" },
  { key = "h", with = "super | shift", action = "SelectPrevTab" },
  { key = ",", with = "super", action = "MoveCurrentTabToPrev" },
  { key = ".", with = "super", action = "MoveCurrentTabToNext" },
  { key = "1", with = "super", action = "SelectTab(0)" },
  { key = "2", with = "super", action = "SelectTab(1)" },
  { key = "3", with = "super", action = "SelectTab(2)" },
  { key = "4", with = "super", action = "SelectTab(3)" },
  { key = "5", with = "super", action = "SelectTab(4)" },
  { key = "6", with = "super", action = "SelectTab(5)" },
  { key = "7", with = "super", action = "SelectTab(6)" },
  { key = "8", with = "super", action = "SelectTab(7)" },
  { key = "9", with = "super", action = "SelectTab(8)" },
  { key = "0", with = "super", action = "SelectLastTab" },
  { key = "\\", with = "super", action = "SplitRight" },
  { key = "-", with = "super", action = "SplitDown" },
  { key = "j", with = "super", action = "SelectNextSplit" },
  { key = "k", with = "super", action = "SelectPrevSplit" },
]

# Not ported — Rio has no equivalent:
#   - keybind reload_config              (no "reload config" action exists)
#   - keybind toggle_split_zoom          (no zoom action)
#   - keybind equalize_splits            (no equalize action)
#   - goto_split:left/right/top/bottom   (Rio only cycles next/prev split,
#                                          not directional focus, so h/j/k/l
#                                          above approximate with next/prev)
#   - focus-follows-mouse                (not configurable in Rio)
#   - shell-integration-features         (not configurable in Rio)
#   - window-colorspace / window-save-state / auto-update (ghostty-only)
