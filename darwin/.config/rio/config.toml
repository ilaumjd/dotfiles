copy-on-select = false
hide-mouse-cursor-when-typing = true
line-height = 1.2
option-as-alt = "both"
theme = "rosepine"

[fonts]
size = 14

[fonts.regular]
family = "FiraCode Nerd Font Mono"

[fonts.bold]
family = "FiraCode Nerd Font Mono"

[fonts.italic]
family = "FiraCode Nerd Font Mono"

[fonts.bold-italic]
family = "FiraCode Nerd Font Mono"

[cursor]
shape = "block"
blinking = false

[scroll]
multiplier = 2.0
divider = 1.0

[window]
opacity = 0.6
blur = true
decorations = "Enabled"
macos-use-unified-titlebar = true
macos-use-shadow = true

# super+ctrl (not super+h/j/k/l/0-9/backslash, and not super+alt) — those are
# already claimed by skhd and by macOS's built-in "Hide Others" (super+alt+h).
[bindings]
keys = [
  { key = "w", with = "super", action = "CloseSplitOrTab" },
  { key = "n", with = "super", action = "CreateWindow" },
  { key = "t", with = "super", action = "CreateTab" },
  { key = ",", with = "super", action = "MoveCurrentTabToPrev" },
  { key = ".", with = "super", action = "MoveCurrentTabToNext" },
  { key = "l", with = "super | control", action = "SelectNextTab" },
  { key = "h", with = "super | control", action = "SelectPrevTab" },
  { key = "j", with = "super | control", action = "SelectNextSplit" },
  { key = "k", with = "super | control", action = "SelectPrevSplit" },
  { key = "1", with = "super | control", action = "SelectTab(0)" },
  { key = "2", with = "super | control", action = "SelectTab(1)" },
  { key = "3", with = "super | control", action = "SelectTab(2)" },
  { key = "4", with = "super | control", action = "SelectTab(3)" },
  { key = "5", with = "super | control", action = "SelectTab(4)" },
  { key = "6", with = "super | control", action = "SelectTab(5)" },
  { key = "7", with = "super | control", action = "SelectTab(6)" },
  { key = "8", with = "super | control", action = "SelectTab(7)" },
  { key = "9", with = "super | control", action = "SelectTab(8)" },
  { key = "0", with = "super | control", action = "SelectLastTab" },
  { key = "\\", with = "super | control", action = "SplitRight" },
  { key = "-", with = "super | control", action = "SplitDown" },
]
